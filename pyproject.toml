[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aetherbridge"
version = "0.1.0"
description = "AI agents for Unreal Engine — Remote Control bridge, NPC brains, level ops, editor automation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "AetherBridge Contributors" }]
keywords = [
  "unreal-engine",
  "ue5",
  "ai-agent",
  "langchain",
  "remote-control",
  "npc",
  "hermes",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "langchain-core>=0.3",
  "langchain>=0.3",
  "langgraph>=0.2",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "httpx",
]
openai = ["langchain-openai>=0.2"]

[project.urls]
Homepage = "https://amiirhosseini.com/aetherbridge/"
Documentation = "https://github.com/Amiirhosseini/aetherbridge#readme"
Repository = "https://github.com/Amiirhosseini/aetherbridge"

[project.scripts]
aetherbridge = "aetherbridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aetherbridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "S110", "BLE001", "I001", "EXE002"]


